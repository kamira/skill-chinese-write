name: governance
on:
  push: { branches: [main] }
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # 隨身治理工具的漂移。上游是否前進看不出來,這道閘只查本地有沒有被改過。
      - name: vendored tools drift
        run: python3 tools/tools_drift_check.py

      - name: doc integrity (CHG↔ACC + 結構同步 + secrets)
        run: python3 tools/autopilot/scripts/doc_integrity_check.py --repo .

      # 範圍**明示**收在本 repo 自己的程式碼:tools/ 是逐位元組相同的副本,
      # 上游已對那四處 shell=True 具名豁免,而豁免記的是上游路徑。
      # 副本的完整性由上一步的漂移檢查負責——重新稽核一份雜湊相符的副本不會增加資訊。
      # 代價寫明:repo 根目錄新增的 .py 不在這個範圍內。
      - name: static & security check (own code; tools/ is covered by the drift check)
        run: python3 tools/autopilot/scripts/static_check.py --repo . --paths skills plugins

      # 好樣本要過、壞樣本要擋——只驗「跑得動」等於沒驗(綠燈可達 + 紅燈可達,KN-001/KN-003)
      - name: style lint fixtures (good must pass, bad must fail)
        run: |
          python3 skills/writing/scripts/style_check.py skills/writing/assets/sample-good.md
          python3 skills/writing/scripts/style_check.py skills/writing/assets/sample-issue.md
          if python3 skills/writing/scripts/style_check.py skills/writing/assets/sample-bad.md > /dev/null; then
            echo "sample-bad.md 竟然通過 lint —— 詞表或門檻壞了"; exit 1
          fi

      # fiction 是第二支 skill,規則與 writing 互斥,所以夾具也要各驗各的
      - name: fiction lint fixtures (good must pass, bad must fail)
        run: |
          python3 skills/fiction/scripts/fiction_check.py skills/fiction/assets/sample-good.md --genre wuxia
          if python3 skills/fiction/scripts/fiction_check.py skills/fiction/assets/sample-bad.md --genre wuxia > /dev/null; then
            echo "fiction sample-bad.md 竟然通過 lint —— 規則或門檻壞了"; exit 1
          fi

      # techdoc 的 bad 夾具要在**兩種 kind** 都被擋——只驗一種等於放掉另一種的規則
      - name: techdoc lint fixtures (both goods pass, bad fails under both kinds)
        run: |
          python3 skills/techdoc/scripts/techdoc_check.py skills/techdoc/assets/sample-spec-good.md --kind spec
          python3 skills/techdoc/scripts/techdoc_check.py skills/techdoc/assets/sample-arch-good.md --kind arch
          for K in spec arch; do
            if python3 skills/techdoc/scripts/techdoc_check.py skills/techdoc/assets/sample-bad.md --kind $K > /dev/null; then
              echo "techdoc sample-bad.md 在 --kind $K 竟然通過 —— 規則或門檻壞了"; exit 1
            fi
          done

      # bizdoc 與 writing 是正面衝突的兩套規則,夾具當然也要各驗各的
      - name: bizdoc lint fixtures (both goods pass, bads fail)
        run: |
          python3 skills/bizdoc/scripts/bizdoc_check.py skills/bizdoc/assets/sample-gov-good.md --kind gov
          python3 skills/bizdoc/scripts/bizdoc_check.py skills/bizdoc/assets/sample-press-good.md --kind press
          for K in gov press; do
            if python3 skills/bizdoc/scripts/bizdoc_check.py skills/bizdoc/assets/sample-bad.md --kind $K > /dev/null; then
              echo "bizdoc sample-bad.md 在 --kind $K 竟然通過 —— 規則或門檻壞了"; exit 1
            fi
          done
          if python3 skills/bizdoc/scripts/bizdoc_check.py skills/bizdoc/assets/sample-gov-bad-subject.md --kind gov > /dev/null; then
            echo "主旨過長的夾具竟然通過 —— 規則或門檻壞了"; exit 1
          fi

      # 八篇文體樣稿收成夾具:四支小說子層各以自己的流派驗,八份全部過 zh-style。
      # 沒有 lint 的四支(prose/poetry/narrative/fu)至少有正字法在管。
      - name: genre sample fixtures
        run: |
          for G in scifi mystery romance flash; do
            python3 skills/fiction/scripts/fiction_check.py "skills/fiction/assets/sample-good-$G.md" --genre $G
          done

      # CHG 標頭欄位不得留佔位字串。doc_integrity 查欄位存在,不查欄位有內容——
      # 兩張 CHG 的 Commit/PR 停在「<close-out 回填>」一路綠燈進了 main。
      - name: CHG header fields (no unreplaced placeholders)
        run: |
          python3 scripts/chg_field_check.py --self-test
          python3 scripts/chg_field_check.py --repo .

      # zh-style 是共用引擎:半形標點在散文與公文裡一樣是錯。
      # 這一步同時擋住既有夾具的回歸——那 12 份曾經全部違規,被當成「好樣本」跑了一輪又一輪。
      - name: zh-style (fixtures both ends + no half-width in any good fixture)
        run: |
          python3 skills/zh-style/scripts/zh_style_check.py --self-test
          python3 skills/zh-style/scripts/zh_style_check.py skills/zh-style/assets/sample-good.md
          if python3 skills/zh-style/scripts/zh_style_check.py skills/zh-style/assets/sample-bad.md > /dev/null; then
            echo "zh-style sample-bad.md 竟然通過"; exit 1
          fi
          python3 skills/zh-style/scripts/zh_style_check.py skills/*/assets/sample-good.md skills/*/assets/sample-issue.md skills/*/assets/sample-spec-good.md skills/*/assets/sample-arch-good.md skills/*/assets/sample-gov-good.md skills/*/assets/sample-press-good.md

      # 23 支 skill 之後,一致性不能再靠人記:沒被打包的 skill 裝不到、
      # 前門叫人跑引擎卻沒帶上引擎會跑不動、沒有 lint 又缺明標節就是空頭規則。
      - name: skill inventory (with red-light self-test)
        run: |
          python3 scripts/skill_inventory_check.py --self-test
          python3 scripts/skill_inventory_check.py --repo .

      # 中/高風險 CHG 要附設計圖。這條規則從 v1.21 起就存在,但一直沒有任何機器在查
      # ——三張中風險 CHG 都有圖,純粹因為寫的人記得畫(KN-001 的型樣第五次)。
      - name: CHG design-diagram gate (real ledger + both fixture ends)
        run: |
          python3 scripts/chg_diagram_gate.py --repo .
          python3 scripts/chg_diagram_gate.py --repo . --glob 'tests/fixtures/chg-gate/pass/case-*.md'
          if python3 scripts/chg_diagram_gate.py --repo . --glob 'tests/fixtures/chg-gate/fail/case-*.md' > /dev/null; then
            echo "缺圖的夾具竟然通過 —— 這道閘等於不存在"; exit 1
          fi

      - name: py_compile all scripts
        run: python3 -m py_compile $(find skills plugins tools -name '*.py' -not -path '*/plugins/*/skills/*')

      - name: JSON validity
        run: |
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            python3 -m json.tool "$f" > /dev/null || { echo "壞掉的 JSON: $f"; exit 1; }
          done

      # 帳本自己也要受閘。沒有這一步,CHG 的格式寫成什麼樣都不會紅。
      - name: autopilot plan-check (plan-format CHGs only; others skipped with log)
        run: |
          for f in docs/writing/changes/CHG-*.md; do
            if grep -qE "^### Global Constraints" "$f" || grep -qE "^- \[.\] T[0-9]" "$f"; then
              python3 tools/autopilot/scripts/autopilot_runner.py plan-check --chg "$f" || exit 1
            else
              echo "(skip non-plan CHG: $f)"
            fi
          done

      # 驗收節不是寫給人看的裝飾:CI 真的跑它一次。
      # (沒有這一步時,`## Acceptance operation` 這個標題層級錯誤存活過三次全綠的 CI。)
      - name: operational verify (the acceptance operation, for real)
        run: bash .github/verify.sh

      - name: plugin skills copies in sync
        run: python3 plugins/build_suite.py --check

      - name: catalog version (static + bump-on-change)
        run: |
          python3 plugins/catalog_check.py --repo . --check
          git fetch origin main --depth=50 || true
          python3 plugins/catalog_check.py --repo . --since origin/main

      # CHG-20260814-06:版號影響閘的**實跑**必須在這個載體上。
      #
      # 複審(fable)指出:修完之後這道閘只活在 ci_local.sh 的 [10f] 裡,
      # verify.sh 只跑 self-test,而 governance.yml 完全不跑 `--repo --since`
      # ——「CI 必須硬紅」的裁決在 GitHub 這個載體上是空話。
      #
      # 注意 fetch **不加 `|| true`**:解耦之後版本紀律整套押在這道 diff 式的閘上,
      # 取不到基準等於規則消失,而輸出會長得跟通過一樣。上一行的 catalog step
      # 容許 fetch 失敗,是因為它只是版本紀律的其中一道;這一行不是。
      # CHG-20260814-08:command 引用路徑的雙住址斷言。
      # 這道閘不需要 git 基準,靜態即可判——沒有 fetch 依賴。
      - name: command reference paths resolve at both addresses
        run: |
          python3 scripts/command_path_check.py --self-test
          python3 scripts/command_path_check.py --repo .

      - name: version impact (skill content change → every host plugin must bump)
        run: |
          python3 scripts/version_impact_check.py --self-test
          git fetch origin main --depth=50
          python3 scripts/version_impact_check.py --repo . --since origin/main
