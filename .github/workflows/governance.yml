name: governance
on:
  push: { branches: [main] }
  pull_request:

# 這個檔**刻意不做任何事**,只負責啟動載體並呼叫唯一真相源。
#
# CHG-20260816-01:在這之前它有自己一份閘,與 `.github/ci_local.sh` 重複了六段
# inline bash,而沒有任何東西斷言那兩份一致。代價實際發生過:夾具搬家只改了
# ci_local,這裡沒跟上,**本機綠而 CI 紅**;反向更久——`genre_ratio_freeze`
# (前六張 CHG 的核心閘)只在 ci_local 跑,這裡從來沒跑過它。
#
# 「一致性靠人記得同步」在這個 repo 已是第四次。前三次加交叉斷言,
# 這次改用讓第二份不存在。任何新的閘都寫進 `ci_local.sh`——
# 寫在這裡會被 `scripts/carrier_manifest_check.py` 擋下,除非在 manifest 具名附理由。
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是必要的:diff 式的閘要 merge-base,淺 clone 取不到分岔點時
      # 訊息會長得跟「沒 fetch」一樣,而那是 fail-closed 的紅。
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # push 事件的基準用 `github.event.before`——這次 push 之前的 tip。
      # **不依賴 merge 策略**(squash / merge commit / 直推 N 個 commit 全對),
      # 而 `HEAD^` 三者都會判錯。pull_request 事件不傳,ci_local 自己退回 origin/main。
      #
      # 沒有這一項的話:main 上 `origin/main` 就是 HEAD 自己,`REF..HEAD` 恆空,
      # 每一條版號規則對每一個檔案都判「沒變」——而輸出與真通過一字不差。
      - name: governance gates (single source of truth)
        env:
          CI_SINCE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bash .github/ci_local.sh
