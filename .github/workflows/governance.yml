name: governance
on:
  push: { branches: [main] }
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # 隨身治理工具的漂移。上游是否前進看不出來,這道閘只查本地有沒有被改過。
      - name: vendored tools drift
        run: python3 tools/tools_drift_check.py

      - name: doc integrity (CHG↔ACC + 結構同步 + secrets)
        run: python3 tools/autopilot/scripts/doc_integrity_check.py --repo .

      # 範圍**明示**收在本 repo 自己的程式碼:tools/ 是逐位元組相同的副本,
      # 上游已對那四處 shell=True 具名豁免,而豁免記的是上游路徑。
      # 副本的完整性由上一步的漂移檢查負責——重新稽核一份雜湊相符的副本不會增加資訊。
      # 代價寫明:repo 根目錄新增的 .py 不在這個範圍內。
      - name: static & security check (own code; tools/ is covered by the drift check)
        run: python3 tools/autopilot/scripts/static_check.py --repo . --paths skills plugins

      # 好樣本要過、壞樣本要擋——只驗「跑得動」等於沒驗(綠燈可達 + 紅燈可達,KN-001/KN-003)
      - name: style lint fixtures (good must pass, bad must fail)
        run: |
          python3 skills/writing/scripts/style_check.py skills/writing/assets/sample-good.md
          python3 skills/writing/scripts/style_check.py skills/writing/assets/sample-issue.md
          if python3 skills/writing/scripts/style_check.py skills/writing/assets/sample-bad.md > /dev/null; then
            echo "sample-bad.md 竟然通過 lint —— 詞表或門檻壞了"; exit 1
          fi

      # fiction 是第二支 skill,規則與 writing 互斥,所以夾具也要各驗各的
      - name: fiction lint fixtures (good must pass, bad must fail)
        run: |
          python3 skills/fiction/scripts/fiction_check.py skills/fiction/assets/sample-good.md --genre wuxia
          if python3 skills/fiction/scripts/fiction_check.py skills/fiction/assets/sample-bad.md --genre wuxia > /dev/null; then
            echo "fiction sample-bad.md 竟然通過 lint —— 規則或門檻壞了"; exit 1
          fi

      - name: py_compile all scripts
        run: python3 -m py_compile $(find skills plugins tools -name '*.py' -not -path '*/plugins/*/skills/*')

      - name: JSON validity
        run: |
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            python3 -m json.tool "$f" > /dev/null || { echo "壞掉的 JSON: $f"; exit 1; }
          done

      # 帳本自己也要受閘。沒有這一步,CHG 的格式寫成什麼樣都不會紅。
      - name: autopilot plan-check (plan-format CHGs only; others skipped with log)
        run: |
          for f in docs/writing/changes/CHG-*.md; do
            if grep -qE "^### Global Constraints" "$f" || grep -qE "^- \[.\] T[0-9]" "$f"; then
              python3 tools/autopilot/scripts/autopilot_runner.py plan-check --chg "$f" || exit 1
            else
              echo "(skip non-plan CHG: $f)"
            fi
          done

      # 驗收節不是寫給人看的裝飾:CI 真的跑它一次。
      # (沒有這一步時,`## Acceptance operation` 這個標題層級錯誤存活過三次全綠的 CI。)
      - name: operational verify (the acceptance operation, for real)
        run: bash .github/verify.sh

      - name: plugin skills copies in sync
        run: python3 plugins/build_suite.py --check

      - name: catalog version (static + bump-on-change)
        run: |
          python3 plugins/catalog_check.py --repo . --check
          git fetch origin main --depth=50 || true
          python3 plugins/catalog_check.py --repo . --since origin/main
