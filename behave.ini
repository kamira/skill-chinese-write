# behave config (CHG-20260803-02 T5)
#
# ASCII-only on purpose: behave reads this file with configparser using the
# locale encoding, so non-ASCII comments crash on a non-UTF-8 console
# (observed: UnicodeDecodeError under cp932 on Windows). Rationale in Chinese
# lives in features/README.md, not here.
#
# stop=false -> report every failure in one run instead of stopping at the first.
# Undefined steps must fail the run: pass --strict on the command line
# (see .github/run_gherkin.sh). A spec that was written but never implemented
# must not look the same as a spec that passed.
[behave]
paths = features
show_skipped = false
stop = false
color = false
